name: CPU tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-tests:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      CUDA_VISIBLE_DEVICES: ""
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      DGLBACKEND: pytorch
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.1.2+cpu --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy==1.24.4 scipy==1.13.1 dgl==1.1.3 tqdm==4.70.0 packaging==24.2
      - name: Verify PyTorch and DGL imports
        run: python -c "import torch, dgl, packaging; print(torch.__version__, dgl.__version__, packaging.__version__); g = dgl.graph(([0, 1], [1, 0])); print(g)"
      - name: Check syntax and release contents
        run: python -B scripts/check_release.py
      - name: Run synthetic numerical and pipeline tests
        run: bash scripts/test.sh
